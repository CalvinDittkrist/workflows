name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code (for plugin validation)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install shellcheck 0.11.0 (same as brew, so local and CI findings match)
        run: |
          sudo apt-get install -y jq
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: Lint scripts
        run: shellcheck -s bash plugins/*/scripts/*.sh
      - name: Validate plugins
        run: |
          claude plugin validate . --strict
          for p in plugins/*; do claude plugin validate "$p" --strict; done
          for d in plugins/*/skills plugins/*/agents; do [ -d "$d" ] && claude plugin validate "$d" --strict; done
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
