name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26' # factory/go.mod is written for 1.25; staticcheck 2026.2.1 needs 1.26 to build
          cache: false # the factory has no dependencies, so there is no go.sum to cache by
      - name: Install staticcheck 2026.2.1 (same version as local, so local and CI findings match)
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - name: Install Claude Code (for plugin validation)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install shellcheck 0.11.0 (same as brew, so local and CI findings match)
        run: |
          sudo apt-get install -y jq
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - name: Install the dashboard's dependencies and the browser its test drives
        run: |
          npm --prefix factory/ui ci
          npm --prefix factory/ui exec -- playwright install --with-deps chromium
      - name: Gate
        run: make check
      - name: Keep the browser test's report when it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: factory/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
